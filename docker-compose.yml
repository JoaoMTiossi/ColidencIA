version: '3.8'
services:
  colidencia:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BUDGET_SEMANAL_USD=18.0
      - DATABASE_URL=sqlite:////app/data/colidencia.db
      # Webhook para alertas de startup/shutdown (Discord, Slack, etc.)
      # Exemplo Discord: https://discord.com/api/webhooks/ID/TOKEN
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_SERVICE_NAME=${ALERT_SERVICE_NAME:-ColidencIA}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
